# dreamfeed: a private timeline where fictional personas post generated images and clips.
#   worker   Has ComfyUI make each persona's posts during GENERATE_WINDOW, runs the adults-only
#            checks, keeps the best, writes their captions, and learns from your likes and skips.
#   agecheck Age estimates for real people in images (CPU).
#   comfyui  Image generation engine. Internal only; the worker drives it over its API.
#   trainer  Style-LoRA training, on demand.
#   follow   Who you follow on Chaturbate, X and Reddit: live rooms and checked posts (CPU).
#   web      The timeline and dashboard (including the persona editor), behind formlogin,
#            served through Caddy at /dreamfeed/.
# The miner's gpu-yield already stops mining while comfyui or the worker use the GPU.
services:
  worker:
    build: ./worker
    image: dreamfeed-worker:local
    container_name: dreamfeed-worker
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    # RAM cap (the tagger, CLIP and the caption model load through here); no swap.
    mem_limit: ${WORKER_MEM_LIMIT:?set WORKER_MEM_LIMIT in .env}
    memswap_limit: ${WORKER_MEM_LIMIT}
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      DATA_DIR: /data
      MODELS_DIR: /models
      HF_HOME: /models/hf                     # tagger downloads land in ./models
      AGECHECK_URL: http://dreamfeed-agecheck:8080
      COMFYUI_URL: http://dreamfeed-comfyui:8188
      COMFYUI_SUPERVISOR_URL: http://dreamfeed-comfyui:8189
      # One model per medium, file names in ./models/checkpoints. Leave one empty to skip that medium.
      CHECKPOINT_ANIME: ${CHECKPOINT_ANIME-}
      CHECKPOINT_FURRY: ${CHECKPOINT_FURRY-}
      GENERATE_WINDOW: ${GENERATE_WINDOW:?set GENERATE_WINDOW in .env} # e.g. 01:00-07:00
      IMAGES_PER_NIGHT: ${IMAGES_PER_NIGHT:?set IMAGES_PER_NIGHT in .env}
      FEED_KEEP_TOP: ${FEED_KEEP_TOP:?set FEED_KEEP_TOP in .env}       # best N per night reach the feed
      FEED_KEEP_DAYS: ${FEED_KEEP_DAYS:-14}
      VIDEOS_PER_NIGHT: ${VIDEOS_PER_NIGHT:-0}           # Wan 2.2 clips after each night's images
      # Wan 2.2 I2V motion LoRA for clips of sex acts (files in ./models/loras); empty: Wan alone
      VIDEO_ACT_LORA_HIGH: ${VIDEO_ACT_LORA_HIGH-}
      VIDEO_ACT_LORA_LOW: ${VIDEO_ACT_LORA_LOW-}
      VIDEO_ACT_LORA_STRENGTH: ${VIDEO_ACT_LORA_STRENGTH:-0.8}
      VIDEO_STYLE_LORA_STRENGTH: ${VIDEO_STYLE_LORA_STRENGTH:-0.7}   # a style's own video LoRA (README: Video LoRAs)
      CAPTION_MODEL: ${CAPTION_MODEL-}       # text model that writes each post's caption; empty: example captions
      STORY_MODEL: ${STORY_MODEL-}           # bigger text model for comics' stories; empty: CAPTION_MODEL
      STORY_MODEL_REVISION: ${STORY_MODEL_REVISION-}
      TZ: ${TZ:?set TZ in .env}
    volumes:
      - ./data:/data
      - ${LORA_DATA_DIR:?set LORA_DATA_DIR in .env}:/data/lora   # style training: downloads, datasets, voices
      - ./models:/models                      # writable: downloads the tagger and CLIP on first run
      # X cookies (Netscape cookies.txt) for downloading artists' images from x.com to train styles.
      - ${X_COOKIES_FILE:?set X_COOKIES_FILE in .env}:/config/cookies.txt:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on: [agecheck]
    logging:
      options: { max-size: 10m, max-file: "3" }

  # Age estimates (MiVOLO v2) for real people in images; the worker's checks call it.
  # CPU only, so it never holds the GPU. Internal; the worker calls it.
  agecheck:
    build: ./agecheck
    image: dreamfeed-agecheck:local
    container_name: dreamfeed-agecheck
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      AGECHECK_THREADS: ${AGECHECK_THREADS:?set AGECHECK_THREADS in .env}
      HF_HOME: /models/hf
    volumes:
      - ./models:/models                      # writable: downloads its models on first run
    logging:
      options: { max-size: 10m, max-file: "3" }

  comfyui:
    build: ./comfyui        # pinned ComfyUI release, no custom nodes
    image: dreamfeed-comfyui:local
    container_name: dreamfeed-comfyui
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    # RAM cap: if video generation runs out of memory, only ComfyUI is killed, never other services.
    mem_limit: ${COMFY_MEM_LIMIT:?set COMFY_MEM_LIMIT in .env}
    memswap_limit: ${COMFY_MEM_LIMIT}
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # ComfyUI only runs while the worker uses it; stopped after this long without a job.
      COMFY_IDLE_STOP_SECONDS: ${COMFY_IDLE_STOP_SECONDS:?set COMFY_IDLE_STOP_SECONDS in .env}
      # ComfyUI is killed if the whole server has less than this much memory free (GB).
      COMFY_HOST_MIN_FREE_GB: ${COMFY_HOST_MIN_FREE_GB:?set COMFY_HOST_MIN_FREE_GB in .env}
    volumes:
      - ./models:/models:ro
      - ./data:/data                          # writes to data/generated
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      options: { max-size: 10m, max-file: "3" }

  # Style-LoRA training. Waits for requests from the dashboard's "Train a style" (the
  # worker downloads and checks the images first); idle it holds no GPU memory. By hand:
  #   docker compose run --rm trainer NAME BASE_CHECKPOINT [STEPS]
  # The worker holds generation while it trains (data/lora/.training).
  trainer:
    build: ./trainer
    image: dreamfeed-trainer:local
    container_name: dreamfeed-trainer
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    shm_size: 8g
    environment:
      HF_HOME: /models/hf                     # SDXL tokenizers, downloaded once
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${LORA_DATA_DIR:?set LORA_DATA_DIR in .env}:/data/lora
      - ./models:/models                      # reads checkpoints, writes loras/style-*.safetensors
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      options: { max-size: 10m, max-file: "3" }

  # Video-LoRA training (Wan 2.2 I2V). Waits for requests from the dashboard's "Train video"
  # on a trained style (the worker downloads and checks the clips first); idle it holds no
  # GPU memory. By hand, one half of Wan at a time or both:
  #   docker compose run --rm video-trainer NAME high|low|both [STEPS]
  video-trainer:
    build: ./video-trainer
    image: dreamfeed-video-trainer:local
    container_name: dreamfeed-video-trainer
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    shm_size: 4g
    # RAM cap with no swap: if training doesn't fit, only it is killed, never other services.
    mem_limit: ${VIDEO_TRAIN_MEM_LIMIT:?set VIDEO_TRAIN_MEM_LIMIT in .env}
    memswap_limit: ${VIDEO_TRAIN_MEM_LIMIT}
    environment:
      HF_HOME: /models/hf
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MALLOC_ARENA_MAX: "2"     # fewer malloc pools: less fragmentation while the 14B model loads
      VIDEO_TRAIN_RES: ${VIDEO_TRAIN_RES:?set VIDEO_TRAIN_RES in .env}
      VIDEO_TRAIN_FRAMES: ${VIDEO_TRAIN_FRAMES:?set VIDEO_TRAIN_FRAMES in .env}
      VIDEO_TRAIN_BLOCKS_TO_SWAP: ${VIDEO_TRAIN_BLOCKS_TO_SWAP:?set VIDEO_TRAIN_BLOCKS_TO_SWAP in .env}
    volumes:
      - ${LORA_DATA_DIR:?set LORA_DATA_DIR in .env}:/data/lora
      # Full-precision Wan 2.2 I2V halves, its T5 and VAE (about 69 GB; a slow disk is fine)
      - ${VIDEO_TRAIN_MODELS:?set VIDEO_TRAIN_MODELS in .env}:/train-models:ro
      - ./models:/models                      # writes loras/video-*.safetensors
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      options: { max-size: 10m, max-file: "3" }

  # Who you follow on other sites (the Following page): which Chaturbate rooms you follow are
  # live, every 2 minutes, and new posts from your X and Reddit feeds, every 15 minutes, each
  # checked first (the adults-only checks, on the CPU, not while a job or training runs). The
  # worker's image; it never touches the GPU.
  follow:
    image: dreamfeed-worker:local     # built by the worker service
    container_name: dreamfeed-follow
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    group_add:
      - "${CB_VIDEOS_GID:-${PGID}}"   # a group that can write in CB_VIDEOS_DIR (highlights, trash), if it's not PGID
    command: ["python", "-m", "dreamfeed", "follow"]
    # RAM cap with no swap (highlights' ffmpeg is the most it does).
    mem_limit: ${FOLLOW_MEM_LIMIT:?set FOLLOW_MEM_LIMIT in .env}
    memswap_limit: ${FOLLOW_MEM_LIMIT}
    environment:
      DATA_DIR: /data
      FOLLOW_THREADS: ${FOLLOW_THREADS:?set FOLLOW_THREADS in .env}   # CPU threads for highlights
      # Your own Reddit app, only for `follow reddit-login` here (README: Feed); the web app reads Reddit.
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET-}
      REDDIT_USERNAME: ${REDDIT_USERNAME-}
      CB_VIDEOS: /videos/cb                    # your own videos of the rooms (posters, highlights)
      TZ: ${TZ:?set TZ in .env}
    volumes:
      - ./data:/data                          # feed.db; room thumbnails and video posters in data/generated/follow
      # Your Chaturbate cookies (Netscape cookies.txt) for the rooms you follow. Read on each
      # look, so a fresh export copied over it (cp, not mv: a file moved in isn't seen until a
      # restart) needs no restart.
      - ${CHATURBATE_COOKIES_FILE:?set CHATURBATE_COOKIES_FILE in .env}:/config/chaturbate-cookies.txt:ro
      # Your own videos of the rooms you follow, a folder per room (README: Live). Written only
      # for highlights (<room>/highlights/) and deletes (into .trash/, emptied after a week).
      - ${CB_VIDEOS_DIR:?set CB_VIDEOS_DIR in .env}:/videos/cb
    logging:
      options: { max-size: 10m, max-file: "3" }

  # Feed at https://<your domain>/dreamfeed/ through Caddy (reachable from anywhere, behind
  # the sign-in page). Set the password with
  #   docker compose exec web python -m formlogin passwd
  # or on first visit, with the setup code from `docker logs dreamfeed-web`.
  web:
    build:
      context: ./web
      additional_contexts:
        formlogin: ${FORMLOGIN_SRC:?set FORMLOGIN_SRC in .env}   # the formlogin library, a git URL with a tag or a local folder
        worker: ./worker    # the persona editor checks edits with the worker's own rules
    image: dreamfeed-web:local
    container_name: dreamfeed-web
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    group_add:
      - "${CB_VIDEOS_GID:-${PGID}}"   # (deleting a video moves it to the trash there)
    environment:
      DATA_DIR: /data
      STATE_DIR: /state
      LORA_DIR: /loras      # trained styles the persona editor can offer
      GENERATE_WINDOW: ${GENERATE_WINDOW:?set GENERATE_WINDOW in .env}   # shown on the dashboard
      STREAMONITOR_URL: ${STREAMONITOR_URL:-}            # your recorder, run from the Live tab (empty: off)
      STREAMONITOR_PASSWORD: ${STREAMONITOR_PASSWORD:-}
      TZ: ${TZ:?set TZ in .env}
      DREAMFEED_USERNAME: ${DREAMFEED_USERNAME:-}
      E621_USERNAME: ${E621_USERNAME-}        # optional: named in e621's user agent (the Feed, the Comics search)
      CB_VIDEOS: /videos/cb                    # your own videos of the rooms, on their Live profiles
      # The live Feed (README: Feed): X with your cookies, Reddit as you (your own Reddit app and
      # the refresh token from `follow reddit-login`). Without them, that site is left out.
      X_COOKIES: /config/x-cookies.txt
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET-}
      REDDIT_USERNAME: ${REDDIT_USERNAME-}
      REDDIT_REFRESH_TOKEN: ${REDDIT_REFRESH_TOKEN-}
      DREAMFEED_PASSWORD_HASH: ${DREAMFEED_PASSWORD_HASH:-}
    volumes:
      - ./data:/data        # feed.db (likes/skips), generated images, liked copies, personas.json
      - ${LORA_DATA_DIR:?set LORA_DATA_DIR in .env}:/data/lora
      - ./models/loras:/loras:ro
      - ./state:/state      # login.json, session.key
      # Your own videos of the rooms you follow, a folder per room (README: Live). Written only
      # for highlights (<room>/highlights/) and deletes (into .trash/, emptied after a week).
      - ${CB_VIDEOS_DIR:?set CB_VIDEOS_DIR in .env}:/videos/cb
      # X cookies (the same export the worker uses for styles), for your X timelines in the Feed.
      - ${X_COOKIES_FILE:?set X_COOKIES_FILE in .env}:/config/x-cookies.txt:ro
    networks: [default, apps]
    logging:
      options: { max-size: 10m, max-file: "3" }

networks:
  apps:
    external: true
