# dreamfeed: a private timeline where fictional personas post generated images and clips.
#   worker   Has ComfyUI make each persona's posts during GENERATE_WINDOW, runs the adults-only
#            checks, keeps the best, and learns from your likes and skips.
#   agecheck Age estimates for real people in images (CPU).
#   comfyui  Image generation engine. Internal only; the worker drives it over its API.
#   trainer  Style-LoRA training, on demand.
#   web      The timeline and dashboard (including the persona editor), behind formlogin,
#            served through Caddy at /dreamfeed/.
# The miner's gpu-yield already stops mining while comfyui or the worker use the GPU.
services:
  worker:
    build: ./worker
    image: dreamfeed-worker:local
    container_name: dreamfeed-worker
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      DATA_DIR: /data
      MODELS_DIR: /models
      HF_HOME: /models/hf                     # tagger downloads land in ./models
      AGECHECK_URL: http://dreamfeed-agecheck:8080
      COMFYUI_URL: http://dreamfeed-comfyui:8188
      COMFYUI_SUPERVISOR_URL: http://dreamfeed-comfyui:8189
      # One model per medium, file names in ./models/checkpoints. Leave one empty to skip that medium.
      CHECKPOINT_ANIME: ${CHECKPOINT_ANIME-}
      CHECKPOINT_FURRY: ${CHECKPOINT_FURRY-}
      GENERATE_WINDOW: ${GENERATE_WINDOW:?set GENERATE_WINDOW in .env} # e.g. 01:00-07:00
      IMAGES_PER_NIGHT: ${IMAGES_PER_NIGHT:?set IMAGES_PER_NIGHT in .env}
      FEED_KEEP_TOP: ${FEED_KEEP_TOP:?set FEED_KEEP_TOP in .env}       # best N per night reach the feed
      FEED_KEEP_DAYS: ${FEED_KEEP_DAYS:-14}
      VIDEOS_PER_NIGHT: ${VIDEOS_PER_NIGHT:-0}           # Wan 2.2 clips after each night's images
      TZ: ${TZ:?set TZ in .env}
    volumes:
      - ./data:/data
      - ./models:/models                      # writable: downloads the tagger and CLIP on first run
      # X cookies (Netscape cookies.txt) for downloading artists' images from x.com to train styles.
      - ${X_COOKIES_FILE:?set X_COOKIES_FILE in .env}:/config/cookies.txt:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on: [agecheck]
    logging:
      options: { max-size: 10m, max-file: "3" }

  # Age estimates (MiVOLO v2) for real people in images; the worker's checks call it.
  # CPU only, so it never holds the GPU. Internal; the worker calls it.
  agecheck:
    build: ./agecheck
    image: dreamfeed-agecheck:local
    container_name: dreamfeed-agecheck
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      AGECHECK_THREADS: ${AGECHECK_THREADS:?set AGECHECK_THREADS in .env}
      HF_HOME: /models/hf
    volumes:
      - ./models:/models                      # writable: downloads its models on first run
    logging:
      options: { max-size: 10m, max-file: "3" }

  comfyui:
    build: ./comfyui        # pinned ComfyUI release, no custom nodes
    image: dreamfeed-comfyui:local
    container_name: dreamfeed-comfyui
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    # RAM cap: if video generation runs out of memory, only ComfyUI is killed, never other services.
    mem_limit: ${COMFY_MEM_LIMIT:?set COMFY_MEM_LIMIT in .env}
    memswap_limit: ${COMFY_MEM_LIMIT}
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # ComfyUI only runs while the worker uses it; stopped after this long without a job.
      COMFY_IDLE_STOP_SECONDS: ${COMFY_IDLE_STOP_SECONDS:?set COMFY_IDLE_STOP_SECONDS in .env}
    volumes:
      - ./models:/models:ro
      - ./data:/data                          # writes to data/generated
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      options: { max-size: 10m, max-file: "3" }

  # Style-LoRA training. Waits for requests from the dashboard's "Train a style" (the
  # worker downloads and checks the images first); idle it holds no GPU memory. By hand:
  #   docker compose run --rm trainer NAME BASE_CHECKPOINT [STEPS]
  # The worker holds generation while it trains (data/lora/.training).
  trainer:
    build: ./trainer
    image: dreamfeed-trainer:local
    container_name: dreamfeed-trainer
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    shm_size: 8g
    environment:
      HF_HOME: /models/hf                     # SDXL tokenizers, downloaded once
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./data/lora:/data/lora
      - ./models:/models                      # reads checkpoints, writes loras/style-*.safetensors
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      options: { max-size: 10m, max-file: "3" }

  # Feed at https://<your domain>/dreamfeed/ through Caddy (reachable from anywhere, behind
  # the sign-in page). Set the password with
  #   docker compose exec web python -m formlogin passwd
  # or on first visit, with the setup code from `docker logs dreamfeed-web`.
  web:
    build:
      context: ./web
      additional_contexts:
        formlogin: ${FORMLOGIN_SRC:?set FORMLOGIN_SRC in .env}   # the formlogin library, a git URL with a tag or a local folder
        worker: ./worker    # the persona editor checks edits with the worker's own rules
    image: dreamfeed-web:local
    container_name: dreamfeed-web
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      DATA_DIR: /data
      STATE_DIR: /state
      LORA_DIR: /loras      # trained styles the persona editor can offer
      GENERATE_WINDOW: ${GENERATE_WINDOW:?set GENERATE_WINDOW in .env}   # shown on the dashboard
      TZ: ${TZ:?set TZ in .env}
      DREAMFEED_USERNAME: ${DREAMFEED_USERNAME:-}
      DREAMFEED_PASSWORD_HASH: ${DREAMFEED_PASSWORD_HASH:-}
    volumes:
      - ./data:/data        # feed.db (likes/skips), generated images, liked copies, personas.json
      - ./models/loras:/loras:ro
      - ./state:/state      # login.json, session.key
    networks: [default, apps]
    logging:
      options: { max-size: 10m, max-file: "3" }

networks:
  apps:
    external: true
