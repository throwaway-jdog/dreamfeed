# dreamfeed: one private feed of what you follow and like, read live from the sites (X, Bluesky,
# Reddit, e621), with long videos (xvideos), comics (e621, multporn) and live rooms (Chaturbate).
#   follow   Who you follow on Chaturbate (live or not), your recordings' posters and highlights,
#            Saved's copies of what you save, follows and unfollows tapped here (CPU).
#   browser  The server's own browser, for signing in to sites from the Dashboard (only when needed).
#   web      The page and its API, behind formlogin, served through Caddy at /dreamfeed/.
services:
  follow:
    build: ./worker
    image: dreamfeed-follow:local
    container_name: dreamfeed-follow
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    group_add:
      - "${CB_VIDEOS_GID:-${PGID}}"   # a group that can write in CB_VIDEOS_DIR (highlights, trash), if it's not PGID
    command: ["python", "-m", "dreamfeed", "follow"]
    # RAM cap with no swap (highlights' ffmpeg is the most it does).
    mem_limit: ${FOLLOW_MEM_LIMIT:?set FOLLOW_MEM_LIMIT in .env}
    memswap_limit: ${FOLLOW_MEM_LIMIT}
    environment:
      DATA_DIR: /data
      FOLLOW_THREADS: ${FOLLOW_THREADS:?set FOLLOW_THREADS in .env}   # CPU threads for highlights
      # Your own Reddit app, only for `follow reddit-login` here (README: Feed); the web app reads Reddit.
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET-}
      REDDIT_USERNAME: ${REDDIT_USERNAME-}
      CB_VIDEOS: /videos/cb                    # your own videos of the rooms (posters, highlights)
      TZ: ${TZ:?set TZ in .env}
    volumes:
      - ./data:/data                          # feed.db; room thumbnails and video posters in data/generated/follow
      # Your Chaturbate cookies (Netscape cookies.txt) for the rooms you follow. Read on each
      # look, so a fresh export copied over it (cp, not mv: a file moved in isn't seen until a
      # restart) needs no restart.
      - ${CHATURBATE_COOKIES_FILE:-/dev/null}:/config/chaturbate-cookies.txt:ro   # (optional: or the dashboard's Sign-ins)
      # Your own videos of the rooms you follow, a folder per room (README: Live). Written only
      # for highlights (<room>/highlights/) and deletes (into .trash/, emptied after a week).
      - ${CB_VIDEOS_DIR:?set CB_VIDEOS_DIR in .env}:/videos/cb
    logging:
      options: { max-size: 10m, max-file: "3" }

  # The server's own browser (Firefox, shown in your browser): the Dashboard's Sign-ins opens it to
  # sign in to X, Chaturbate and the like yourself (captchas and codes included), then takes the
  # site's cookies from its profile. Reached only through the proxy, after dreamfeed's sign-in
  # (README: Sign-ins); its profile, your sign-ins there, is kept in data/browser.
  # It runs only when needed: started for you or, once a day, out of sight to take fresh cookies
  # from it, and stopped when no one's watching. dreamfeed only asks (a file in data/browser-power);
  # systemd units on the host start and stop it (browserpower/install.sh, README: Sign-ins).
  browser:
    image: jlesage/firefox:v26.09.1
    container_name: dreamfeed-browser
    restart: "no"
    shm_size: 2g                     # (Firefox needs more than Docker's 64 MB)
    environment:
      USER_ID: ${PUID}
      GROUP_ID: ${PGID}
      TZ: ${TZ:?set TZ in .env}
      KEEP_APP_RUNNING: "1"
      DISPLAY_WIDTH: "1280"
      DISPLAY_HEIGHT: "900"
    volumes:
      - ./data/browser:/config
    networks: [apps]
    logging:
      options: { max-size: 10m, max-file: "3" }

  # Feed at https://<your domain>/dreamfeed/ through Caddy (reachable from anywhere, behind
  # the sign-in page). Set the password with
  #   docker compose exec web python -m formlogin passwd
  # or on first visit, with the setup code from `docker logs dreamfeed-web`.
  web:
    build:
      context: ./web
      additional_contexts:
        formlogin: ${FORMLOGIN_SRC:?set FORMLOGIN_SRC in .env}   # the formlogin library, a git URL with a tag or a local folder
        worker: ./worker    # dreamfeed's own code: the live sites (feed/), Chaturbate (live/), sign-ins and rules (core/)
    image: dreamfeed-web:local
    container_name: dreamfeed-web
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    group_add:
      - "${CB_VIDEOS_GID:-${PGID}}"   # (deleting a video moves it to the trash there)
    environment:
      DATA_DIR: /data
      STATE_DIR: /state
      STREAMONITOR_URL: ${STREAMONITOR_URL:-}            # your recorder, run from the Live tab (empty: off)
      STREAMONITOR_PASSWORD: ${STREAMONITOR_PASSWORD:-}
      TZ: ${TZ:?set TZ in .env}
      DREAMFEED_USERNAME: ${DREAMFEED_USERNAME:-}
      E621_USERNAME: ${E621_USERNAME-}        # optional: named in e621's user agent (the Feed, the Comics search)
      E621_API_KEY: ${E621_API_KEY-}          # optional: signed in as you (or the Dashboard's Sign-ins)
      CB_VIDEOS: /videos/cb                    # your own videos of the rooms, on their Live profiles
      # The live Feed (README: Feed): X with your cookies, Reddit as you (your own Reddit app and
      # the refresh token from `follow reddit-login`). Without them, that site is left out.
      X_COOKIES: /config/x-cookies.txt           # (X_COOKIES_FILE's; the dashboard's Sign-ins come first)
      CHATURBATE_COOKIES: /config/chaturbate-cookies.txt   # (only shown on the dashboard: the follow service uses them)
      BROWSER_PROFILE: /data/browser/profile     # the browser service's profile (in ./data), for Take its cookies
      BROWSER_URL: ${BROWSER_URL:-}              # its address, as the proxy serves it (e.g. browser/, beside the Feed); empty: off
      BROWSER_POWER_DIR: /data/browser-power     # where it asks for the browser to start or stop (browserpower/)
      BROWSER_SCREEN: dreamfeed-browser:5800     # the browser's page, to tell when it's up
      X_RELATED_QUERY: ${X_RELATED_QUERY:-}      # X's "more videos" call id, when X changes it (empty: the known one)
      RANDOM_SUBREDDITS_URL: ${RANDOM_SUBREDDITS_URL:-}   # Browse's 🎲: a list of subreddit names, one a line (empty: off)
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET-}
      REDDIT_USERNAME: ${REDDIT_USERNAME-}
      REDDIT_REFRESH_TOKEN: ${REDDIT_REFRESH_TOKEN-}
      DREAMFEED_PASSWORD_HASH: ${DREAMFEED_PASSWORD_HASH:-}
    volumes:
      - ./data:/data        # feed.db (likes/skips), generated images, liked copies, personas.json
      - ./state:/state      # login.json, session.key
      # Your own videos of the rooms you follow, a folder per room (README: Live). Written only
      # for highlights (<room>/highlights/) and deletes (into .trash/, emptied after a week).
      - ${CB_VIDEOS_DIR:?set CB_VIDEOS_DIR in .env}:/videos/cb
      # X cookies, for your X timelines in the Feed (or the Dashboard's Sign-ins).
      - ${X_COOKIES_FILE:-/dev/null}:/config/x-cookies.txt:ro
      - ${CHATURBATE_COOKIES_FILE:-/dev/null}:/config/chaturbate-cookies.txt:ro
    networks: [default, apps]
    logging:
      options: { max-size: 10m, max-file: "3" }

networks:
  apps:
    external: true
